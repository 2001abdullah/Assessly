name: Android Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API URL, for example https://assessly-api.onrender.com
        required: true
        type: string
      release_tag:
        description: Optional release tag. Leave empty for an artifact-only build.
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Play upload signing
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$PLAY_UPLOAD_STORE_PASSWORD" \
            "$PLAY_UPLOAD_KEY_PASSWORD" \
            "$PLAY_UPLOAD_KEY_ALIAS" > android/key.properties

      - name: Build Play Store app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: assessly-android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: build/app/outputs/bundle/release/app-release.aab
