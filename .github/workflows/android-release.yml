name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API URL, for example https://assessly-api.onrender.com
        required: true
        type: string
      release_tag:
        description: Optional release tag. Leave empty for an artifact-only build.
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Play upload signing
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          echo "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$PLAY_UPLOAD_STORE_PASSWORD" \
            "$PLAY_UPLOAD_KEY_PASSWORD" \
            "$PLAY_UPLOAD_KEY_ALIAS" > android/key.properties

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build Android release packages
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://assessly-api.onrender.com' }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url || 'https://assessly-api.onrender.com' }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          cp build/app/outputs/bundle/release/app-release.aab Assessly-v1.0.0-beta.3.aab
          cp build/app/outputs/flutter-apk/app-release.apk Assessly-v1.0.0-beta.3.apk

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assessly-android-release
          path: |
            Assessly-v1.0.0-beta.3.aab
            Assessly-v1.0.0-beta.3.apk

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            Assessly-v1.0.0-beta.3.aab
            Assessly-v1.0.0-beta.3.apk
