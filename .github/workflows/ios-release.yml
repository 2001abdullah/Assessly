name: iOS Release

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend API URL, for example https://assessly-api.onrender.com
        required: true
        type: string
      release_tag:
        description: Optional release tag. Leave empty for an artifact-only build.
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Package unsigned iOS archive
        run: |
          mkdir -p build/ios/artifact
          ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive build/ios/artifact/assessly-ios-unsigned-xcarchive.zip

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: assessly-ios-unsigned
          path: build/ios/artifact/assessly-ios-unsigned-xcarchive.zip

      - name: Create GitHub release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: build/ios/artifact/assessly-ios-unsigned-xcarchive.zip
